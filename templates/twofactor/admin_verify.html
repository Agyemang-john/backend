{% extends "twofactor/admin_base.html" %}
{% block title %}Two-step verification{% endblock %}
{% block card %}
  <h2 style="margin-top:0">Two-step verification</h2>
  <p>Enter the 6-digit code from your authenticator app, or one of your recovery codes.</p>
  {% if error %}<p style="color:#c62828">{{ error }}</p>{% endif %}
  <form method="post">{% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <input name="code" autocomplete="one-time-code" inputmode="numeric" autofocus required
           style="font-size:22px;letter-spacing:4px;width:100%;padding:8px;margin:8px 0">
    <button type="submit" class="button default" style="width:100%;padding:10px">Verify</button>
  </form>
{% endblock %}
